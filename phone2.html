function mk(a){const d=document.createElement('div');d.className='app';d.dataset.id=a[1];
 d.innerHTML=`<span class="ia">${IC[a[1]]}${a[1]==='msgs'?'<em class="bdg"></em>':''}</span>${a[0]}`;
 d.onclick=()=>a[2]=='x'?toast('지금은 열 수 없어요'):open(a[2]);return d}

function updBadge(){const n=Object.values(threads).filter(t=>t.unread&&!t.hidden).length;document.querySelectorAll('.bdg').forEach(e=>{e.textContent=n;e.style.display=n?'block':'none'})}
updBadge();$('#wx').onclick=()=>toast('지금은 열 수 없어요');

/* ---------- navigation ---------- */
let locked=true,cur='home',started=false,curChat=null,noteOpen=false,subBack=null,swI=0;
function show(id){['#home','#app','#viewer'].forEach(s=>$(s).classList.remove('on'));if(id)$(id).classList.add('on')}
function setDark(on){$('#status').classList.toggle('dark',on);$('#nav').classList.toggle('dark',on)}
function goHome(){subBack=null;clearInterval(swI);clearInterval(musI);cur='home';curChat=null;noteOpen=false;show('#home');setDark(false);updBadge()}
function ended(){return $('#end').classList.contains('on')}
function goBack(){
 if(locked||ended())return;
 if($('#sheet').classList.contains('on')){$('#sheet').classList.remove('on');return}
 if($('#viewer').classList.contains('on')){vcur=-1;show('#app');setDark(true);return}
 if(cur==='msgs'&&curChat){msgs();return}
 if(subBack){const b=subBack;subBack=null;b();return}
 if(cur==='notes'&&noteOpen){notesApp();return}
 if(cur!=='home')goHome()}
function unlock(){locked=false;pin='';$('#phone').classList.add('un');$('#lock').classList.remove('on');show('#home');if(URGE.onUnlock)startUrge();}
let pin='';
function pinUpd(){document.querySelectorAll('#pdots i').forEach((d,i)=>d.classList.toggle('on',i<pin.length))}
function pinKey(k){if(!locked)return;if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;pinUpd();
 if(pin.length===4){if(pin==='0000')setTimeout(unlock,150);else{$('#pmsg').textContent='비밀번호가 올바르지 않습니다';$('#pdots').classList.add('shake');setTimeout(()=>{pin='';pinUpd();$('#pdots').classList.remove('shake')},500)}}}
document.querySelectorAll('.pk button[data-k]').forEach(b=>b.onclick=()=>pinKey(b.dataset.k));
addEventListener('keydown',e=>{if(!locked)return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('⌫')});
$('#nhome').onclick=()=>{if(!locked&&!ended())goHome()};
$('#nback').onclick=goBack;$('#nrec').onclick=()=>{if(!locked)toast('최근 사용한 앱이 없습니다')};
$('#app').addEventListener('click',e=>{if(e.target.closest('.bk'))goBack()});
function open(n){cur=n;subBack=null;if(n==='photos'){gv++;saveGV()}show('#app');setDark(true);A().style.background=({gaagle:'#fff',notes:'#fafafa',camera:'#000',music:'linear-gradient(180deg,#4a3c86 0%,#2c2748 32%,#14141a 66%)'})[n]||'';
 ({msgs,photos:photosApp,cal:calApp,notes:notesApp,gaagle:gaagleApp,clock:clockApp,calc:calcApp,phone:phoneApp,contacts:contactsApp,settings:settingsApp,files:filesApp,play:playApp,maps:mapsApp,camera:cameraApp,music:musicApp})[n]()}
const A=()=>$('#app');
const HD=(r='<span style="width:40px"></span>')=>`<div class="hd"><span class="bk">‹</span>${r}</div>`;

/* ---------- messages ---------- */
let clock=2,deskIdx=0,sunIdx=0;
const fmt=()=>{const d=new Date(),h=d.getHours();return(h<12?'오전 ':'오후 ')+(h%12||12)+':'+String(d.getMinutes()).padStart(2,'0')};
const lastMsg=t=>{for(let i=t.msgs.length-1;i>=0;i--)if(t.msgs[i][0]!=='d')return t.msgs[i];return null};
function msgs(){
 curChat=null;
 let h=HD()+`<h1>메시지</h1><div class="list">`;
 Object.entries(threads).filter(([k,t])=>!t.hidden).sort((a,b)=>b[1].ts-a[1].ts).forEach(([k,t])=>{
  const l=lastMsg(t);
  h+=`<div class="row" data-k="${k}"><div class="av" style="background:${AV[k][1]}">${AV[k][0]}</div><div style="flex:1;min-width:0"><div class="top"><b>${t.name}</b><span class="tm2">${t.time}</span></div><small>${l?l[1]:''}</small></div>${t.unread?'<div class="dot">'+t.unread+'</div>':''}</div>`});
 A().innerHTML=h+'</div>';
 A().querySelectorAll('.row').forEach(r=>r.onclick=()=>chat(r.dataset.k))}
function chat(k){
 const t=threads[k];t.unread=0;curChat=k;
 A().innerHTML=HD(`<span class="av" style="background:${AV[k][1]};width:36px;height:36px;font-size:16px">${AV[k][0]}</span><span class="cn">${t.name}</span>`)+`<div id="chatlog"></div>
 <div class="compose"><input id="in" placeholder="메시지 입력" autocomplete="off"><button id="go">↑</button></div>`;
 t.msgs.forEach(m=>bubble(m[0],m[1]));
 const send=()=>{const v=$('#in').value.trim();if(!v)return;$('#in').value='';t.msgs.push(['r',v]);t.ts=++clock;t.time=fmt();bubble('r',v);reply(k,v)};
 $('#go').onclick=send;$('#in').onkeydown=e=>{if(e.key==='Enter')send()}}
function bubble(s,t){const log=$('#chatlog');if(!log)return;const d=document.createElement('div');d.className='b '+s;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function push(k,text){const t=threads[k];t.msgs.push(['l',text]);t.ts=++clock;t.time=fmt();if(cur==='msgs'&&curChat===k)bubble('l',text);else{t.unread=(t.unread||0)+1;buzz()}updBadge()}

 return `<div style="padding:10px 0 2px;font-weight:700">${sm}월 ${sd}일 ${wk[new Date(sy,sm-1,sd).getDay()]}요일</div>`+(ev.map(e=>`<div class="ev"><div class="tm">${e[1]}</div><div class="c" style="background:${e[3]}"></div><div style="min-width:0"><em>${e[2]}</em></div></div>`).join('')||'<div style="color:#8a8a90;padding:14px 0">일정 없음</div>')};
function calApp(dir=0){
 subBack=null;
 const first=new Date(cy,cm,1).getDay(),n=new Date(cy,cm+1,0).getDate();
 let g=wk.map((w,i)=>`<div class="wd ${i==0?'su':i==6?'sa':''}">${w}</div>`).join('');
 for(let i=0;i<first;i++)g+='<div></div>';
 for(let d=1;d<=n;d++){const k=`${cy}-${pad(cm+1)}-${pad(d)}`,dw=(first+d-1)%7;
  g+=`<div class="dc ${dw==0?'su':dw==6?'sa':''} ${k===TODAYK?'td':''} ${k===csel?'sl':''}" data-k="${k}"><span>${d}</span><i class="${evsOn(k).length?'ev-dot':''}"></i></div>`}
 A().innerHTML=HD('<span class="cmh"><i id="pm">‹</i><i id="nm">›</i></span>')+`<h1>${cm+1}월 <small>${cy}</small></h1><div id="cw" class="cwrap ${dir>0?'inR':dir<0?'inL':''}"><div class="cg">${g}</div><div class="evs" id="evs">${evHTML()}</div></div>`;
 A().querySelectorAll('.dc').forEach(c=>c.onclick=()=>{csel=c.dataset.k;A().querySelectorAll('.dc').forEach(x=>x.classList.toggle('sl',x===c));$('#evs').innerHTML=evHTML()});
 $('#pm').onclick=()=>mv(-1);$('#nm').onclick=()=>mv(1)}

 pdf:'<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#111" stroke-width="2"><rect x="4" y="2" width="18" height="22" rx="4"/><text x="13" y="15" font-size="7" font-weight="800" text-anchor="middle" fill="#111" stroke="none">PDF</text></svg>',

const nT=n=>`${n.d[2]<12?'오전':'오후'} ${n.d[2]%12||12}:${String(n.d[3]).padStart(2,'0')}`;
const nTS=n=>new Date(2026,n.d[0]-1,n.d[1],n.d[2],n.d[3]).getTime();
const nG=n=>{const t=sNow(),df=Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(2026,n.d[0]-1,n.d[1]))/864e5);return df<=0?'오늘':df<=7?'지난 7일':df<=30?'지난 30일':n.d[0]+'월'};
function notesApp(){
 noteOpen=false;
 A().innerHTML=HD()+`<div class="nh"><b>폴더</b><span>노트 ${notes.length}개</span></div>
 <div class="tb"><span onclick="toast('지금은 열 수 없어요')">${ico.ham}</span><span class="tr"><i onclick="toast('PDF 추가 불가')">${ico.pdf}</i><i onclick="toast('검색할 수 없어요')">${ico.sea}</i><i>${ico.kb}</i></span></div>

 const L=A().querySelector('#nl');let last='';
 notes.map((n,i)=>i).sort((a,b)=>nTS(notes[b])-nTS(notes[a])||b-a).forEach(i=>{const n=notes[i],g=nG(n);
  if(g!==last){last=g;const h=document.createElement('div');h.className='sh';h.textContent=g;L.appendChild(h)}
  const e=document.createElement('div');e.className='nc';
  e.innerHTML=(n.t?'<div class="t1"></div>':'')+`<div class="t2" ${n.t?'':'style="margin-top:0"'}>${g==='오늘'?nT(n):n.d[0]+'월 '+n.d[1]+'일 '+nT(n)}</div><pre></pre>`;
  if(n.t)e.querySelector('.t1').textContent=n.t;e.querySelector('pre').textContent=n.b;
  e.onclick=()=>{noteOpen=true;
   A().innerHTML=HD()+`<div class="ntext"></div>`;
   const box=A().querySelector('.ntext');
   if(n.t){const t=document.createElement('div');t.className='nt';t.textContent=n.t;box.appendChild(t)}
   const body=document.createElement('div');body.contentEditable='true';body.textContent=n.b;body.oninput=()=>n.b=body.innerText;box.appendChild(body)};
  L.appendChild(e)})}

 <div class="list" style="padding:0 18px">${/시이나\s*니키/.test(q)?`<div class="gimg"><img src="${NIKI}" alt=""></div>`:''}${[['최신 소식','enter.example.com › news','에 대한 최신 기사와 소식을 모아봤습니다. 일정과 근황, 관련 보도를 한눈에 확인하세요.'],['관련 검색 결과','star.example.com › search','관련 인물과 팀의 활동 내역, 공개 스케줄 등을 정리한 페이지입니다.'],['팬 커뮤니티 모음','fan.example.com › board','팬들이 올린 후기와 목격담, 이슈를 확인할 수 있는 게시판입니다.']].map(r=>`<div class="gr"><small>${r[1]}</small><b>${esc(q)} - ${r[0]}</b><p>${esc(q)}${r[2]}</p></div>`).join('')}</div>`;
 $('#gq').value=q;$('#gx').onclick=()=>gaagleSearch('');$('#gq').onkeydown=e=>{if(e.key==='Enter')gaagleResults($('#gq').value)}}

/* ---------- clock ---------- */
const alarms=[];for(let m=200;m<=420;m+=5)alarms.push([Math.floor(m/60),m%60]);for(let h=8;h<=23;h++)alarms.push([h,0]);
const aon=new Set();let swc={run:false,t0:0,acc:0,laps:[]},tm={init:300,left:300,run:false,end:0};
const fmtT=ms=>pad(Math.floor(ms/60000))+':'+pad(Math.floor(ms/1000)%60)+'.'+pad(Math.floor(ms/10)%100);
const tleft=()=>tm.run?Math.max(0,Math.ceil((tm.end-Date.now())/1000)):tm.left;
const tfmt=t=>pad(Math.floor(t/60))+':'+pad(t%60);
const WZ=[['도쿄','Asia/Tokyo'],['런던','Europe/London'],['뉴욕','America/New_York'],['시드니','Australia/Sydney']];
function tabs(on,list,fn){return `<div class="ctab">${list.map(t=>`<span class="${t[0]===on?'on':''}" data-t="${t[0]}">${t[1]}</span>`).join('')}</div>`}
function clockApp(tab='alarm'){
 subBack=null;clearInterval(swI);
 const TB=tabs(tab,[['alarm','알람'],['world','세계 시계'],['stop','스톱워치'],['timer','타이머']]);
 const bind=()=>A().querySelectorAll('.ctab span').forEach(e=>e.onclick=()=>clockApp(e.dataset.t));
 if(tab==='alarm'){
  A().innerHTML=HD('<span class="cmh"><i onclick="toast(\'알람을 추가할 수 없어요\')">＋</i><i style="font-size:22px" onclick="toast(\'지금은 열 수 없어요\')">⋮</i></span>')+`<h1>알람</h1><div class="asub" id="asub"></div><div class="list" id="al" style="padding:0 12px 80px"></div>`+TB;
  const upd=()=>$('#asub').textContent=aon.size?`알람 ${aon.size}개 켜짐`:'예정된 알람 없음';
  alarms.forEach((a,i)=>{const e=document.createElement('div');e.className='al'+(aon.has(i)?'':' off');
   e.innerHTML=`<div><span class="ap">${a[0]<12?'오전':'오후'}</span><b>${a[0]%12||12}:${pad(a[1])}</b><small>평일</small></div><div class="sw${aon.has(i)?' on':''}"></div>`;
   e.onclick=()=>{aon.has(i)?aon.delete(i):aon.add(i);e.classList.toggle('off',!aon.has(i));e.querySelector('.sw').classList.toggle('on',aon.has(i));upd()};
   $('#al').appendChild(e)});upd()}
 else if(tab==='world'){
  A().innerHTML=HD()+`<h1>세계 시계</h1><div class="list" style="padding:0 12px 80px">${WZ.map(z=>`<div class="al"><div><small style="font-size:13px;color:#777;margin:0">${new Date().toLocaleDateString('ko-KR',{timeZone:z[1],month:'long',day:'numeric',weekday:'short'})}</small><div style="font-size:19px;font-weight:600">${z[0]}</div></div><b style="font-size:30px;font-weight:400">${new Date().toLocaleTimeString('ko-KR',{timeZone:z[1],hour:'numeric',minute:'2-digit'})}</b></div>`).join('')}</div>`+TB}
 else if(tab==='stop'){
  const cur=()=>swc.acc+(swc.run?Date.now()-swc.t0:0);
  A().innerHTML=HD()+`<h1>스톱워치</h1><div class="bigt" id="swd">${fmtT(cur())}</div><div class="cbtns"><button id="sb2">${swc.run?'랩':'초기화'}</button><button id="sb1" class="go">${swc.run?'중지':'시작'}</button></div><div class="list" style="padding:10px 24px 80px">${swc.laps.map((l,i)=>`<div class="lap"><span>랩 ${swc.laps.length-i}</span><b>${l}</b></div>`).join('')}</div>`+TB;
  $('#sb1').onclick=()=>{if(swc.run){swc.acc+=Date.now()-swc.t0;swc.run=false}else{swc.t0=Date.now();swc.run=true}clockApp('stop')};
  $('#sb2').onclick=()=>{if(swc.run)swc.laps.unshift(fmtT(cur()));else{swc.acc=0;swc.laps=[]}clockApp('stop')};
  if(swc.run)swI=setInterval(()=>{const d=$('#swd');if(d)d.textContent=fmtT(cur())},50)}
 else{
  A().innerHTML=HD()+`<h1>타이머</h1><div class="bigt" id="tmd">${tfmt(tleft())}</div><div class="cbtns">${tm.run?'':'<button id="tm1">−1분</button>'}<button id="tm2" class="go">${tm.run?'일시정지':'시작'}</button>${tm.run?'':'<button id="tm3">+1분</button>'}</div><div class="cbtns"><button id="tm4">취소</button></div>`+TB;
  if(!tm.run){$('#tm1').onclick=()=>{tm.init=tm.left=Math.max(60,tm.left-60);clockApp('timer')};$('#tm3').onclick=()=>{tm.init=tm.left=Math.min(5940,tm.left+60);clockApp('timer')}}
  $('#tm2').onclick=()=>{if(tm.run){tm.left=tleft();tm.run=false}else{tm.run=true;tm.end=Date.now()+tm.left*1000}clockApp('timer')};
  $('#tm4').onclick=()=>{tm.run=false;tm.left=tm.init;clockApp('timer')};
  if(tm.run)swI=setInterval(()=>{const d=$('#tmd');if(!d)return;const t=tleft();d.textContent=tfmt(t);if(t===0){tm.run=false;tm.left=tm.init;toast('타이머가 완료되었습니다');clockApp('timer')}},250)}
 bind()}

/* ---------- calculator ---------- */
let cx='',lastEq=false;
function calcEval(e){let t=e.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100').replace(/[+\-*/.(]+$/,'');
 const o=(t.match(/\(/g)||[]).length,c=(t.match(/\)/g)||[]).length;t+=')'.repeat(Math.max(0,o-c));
 if(!t||!/^[0-9+\-*/().\s]+$/.test(t))return null;try{const v=Function('"use strict";return ('+t+')')();return isFinite(v)?+v.toPrecision(12):null}catch(x){return null}}
function calcApp(){
 A().style.background='#f6f6f6';
 A().innerHTML=HD()+`<div class="cdisp"><div class="cex" id="cex"></div><div class="crs" id="crs"></div></div><div class="ckp">${['C','()','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','⌫','0','.','='].map(k=>`<button class="ck ${'÷×−+'.includes(k)?'op':k==='='?'eq':'C()%⌫'.includes(k)?'fn':''}" data-k="${k}">${k}</button>`).join('')}</div>`;
 const upd=()=>{$('#cex').textContent=cx;const r=/[+\-×÷%()−]/.test(cx.replace(/^-/,''))?calcEval(cx):null;$('#crs').textContent=lastEq?'':(r===null?'':'= '+r.toLocaleString('ko-KR',{maximumFractionDigits:10}))};
 A().querySelectorAll('.ck').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
  if(lastEq&&/[\d.(]/.test(k))cx='';lastEq=false;
  if(k==='C')cx='';else if(k==='⌫')cx=cx.slice(0,-1);
  else if(k==='='){const r=calcEval(cx);if(r===null)return toast('수식을 확인해 주세요');cx=String(r);lastEq=true}
  else if(k==='()'){const o=(cx.match(/\(/g)||[]).length,c=(cx.match(/\)/g)||[]).length;cx+=(o>c&&/[\d)%]$/.test(cx))?')':'('}
  else cx+=k;upd()});upd()}

function contactsApp(){subBack=null;A().innerHTML=HD()+`<h1>연락처</h1><div class="asub">연락처 ${CT.length}개</div><div class="list" id="cl"></div>`;contactRows($('#cl'))}

 c.classList.add('on');let sec=0,iv=0;

 $('#mthumb').src=SONGS[mus.i][2]==='c'?COVER_C:COVER_A;
 document.querySelectorAll('.murow').forEach(r=>r.classList.toggle('cur',+r.dataset.i===mus.i&&mus.play))}

 <g fill="#cfe8c4"><rect x="20" y="170" width="90" height="70" rx="8"/><rect x="250" y="60" width="90" height="80" rx="8"/><rect x="130" y="330" width="80" height="60" rx="8"/></g>
 <g stroke="#fff" fill="none" stroke-linecap="round"><path d="M0 130H360M0 290H360M0 420H360" stroke-width="11"/><path d="M110 0V700M240 0V700" stroke-width="11"/><path d="M0 600L360 200" stroke-width="14"/></g>
 <circle cx="180" cy="300" r="22" fill="#4285f4" opacity=".2"/><circle cx="180" cy="300" r="8" fill="#4285f4" stroke="#fff" stroke-width="3"/></svg>
 <div class="mtop"><div class="gbar" style="margin:0" onclick="toast('검색할 수 없어요')"><span style="color:#111">←</span><span>장소, 주소 검색</span><i>🎙</i></div>
 <div class="gchips" style="padding:8px 0 0">${['식당','카페','편의점','주유소','약국'].map(c=>`<span data-c="${c}">${c}</span>`).join('')}</div></div>
 <div class="mloc" onclick="toast('현재 위치를 찾았어요')">◎</div><div class="msheet" id="ms"></div>`;
 const R={'식당':[['C국밥집','국밥 · 120m'],['D순대국집','한식 · 240m'],['E파스타집','양식 · 310m']],'카페':[['A커피','카페 · 80m'],['B카페','카페 · 190m']],'편의점':[['F마트','편의점 · 60m'],['G편의점','편의점 · 150m']],'주유소':[['H주유소','주유소 · 700m']],'약국':[['I약국','약국 · 220m']]};
 A().querySelectorAll('.gchips span').forEach(c=>c.onclick=()=>{$('#ms').innerHTML=`<b>${c.dataset.c} 근처</b>`+R[c.dataset.c].map(r=>`<div class="mr"><b>${r[0]}</b><small>${r[1]}</small></div>`).join('');$('#ms').classList.add('on')})}

/* ---------- camera ---------- */
function cameraApp(){
 subBack=null;setDark(false);
 A().innerHTML=`<div class="camv"><div class="cflash" id="cfl"></div><div class="ctopb"><span class="bk" style="color:#fff">‹</span><span>⚡︎</span><span>⏱</span><span>3:4</span><span>⚙︎</span></div>
 <div class="cmodes"><span>싱글 테이크</span><span class="on">사진</span><span>동영상</span><span>더보기</span></div>
 <div class="cshut"><div class="cth"></div><div class="csb" id="csb"></div><div class="cflip">⟲</div></div></div>`;
 $('#csb').onclick=()=>{const f=$('#cfl');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');
 const t=sNow(),P=x=>String(x).padStart(2,'0');
 PH.push({g:'#000',c:'사진',d:[t.getMonth()+1,t.getDate(),t.getHours(),t.getMinutes()],y:t.getFullYear(),n:'너무 어두워서 아무것도 보이지 않아.',cam:1,file:`${t.getFullYear()}${P(t.getMonth()+1)}${P(t.getDate())}_${P(t.getHours())}${P(t.getMinutes())}${P(t.getSeconds())}`});
 toast('사진을 저장했어요')}}


/* ---------- 스토리 나레이션 ---------- */
const nextUrl=()=>STORY.passGV?STORY.next+(STORY.next.includes('?')?'&':'?')+'gv='+Math.min(gv,REVEAL.length):STORY.next;
function narrate(t,delay=0){setTimeout(()=>{const n=$('#narr');
 n.innerHTML=`<div><p>${t.replace(/\n/g,'<br>')}</p><button id="narrOk">계속하기</button>${STORY.next?`<a href="${nextUrl()}">${STORY.label}</a>`:''}</div>`;
 n.classList.add('on');$('#narrOk').onclick=()=>n.classList.remove('on')},delay)}

/* 핸드폰 2: 사진 삭제·공유 버튼은 아직 비활성화 */
const _view=view;view=function(i,d){_view(i,d);['#vdel','#vshare'].forEach(q=>{const e=$(q);e.classList.add('dis');e.onclick=()=>toast('지금은 사용할 수 없어요')})};
/* (알 수 없음) 대화를 처음 열면 → 박팀장님에게 문자가 오고 → 잠시 뒤 나레이션 */
let narr2=false;const _chat=chat;chat=function(k){_chat(k);if(k==='unk'&&!narr2){narr2=true;
 setTimeout(()=>{const x='어때, 뭐 좀 잡았어? 요즘 공들였잖아.';push('desk',x);heads('박팀장님',x,()=>{open('msgs');chat('desk')});startUrge()},2500);
 narrate('나는 이 사진을 어떻게 하지?',7500)}};

/* ---------- endings ---------- */
function finish(type){
 const t=type==='del'?
 ['ENDING A — 삭제','휴지통으로 이동했다.\n30일 동안은 복원할 수 있다.\n\n그 사이, 낯선 번호의 답장은 오지 않았다.\n\n실적은 여전히 빈손이다.\n그래도 이상하게, 오늘은 잠이 올 것 같다.']:
 ['ENDING B — 송고','전송 완료.\n\n몇 분 뒤, 박팀장님에게서 답이 왔다.\n"이거다. 오늘 밤 단독으로 간다."\n\n화면 위로 알 수 없는 번호의 알림이 뜬다.\n— 읽지 않은 메시지 1개\n\n끝내 열어보지 못했다.'];
 const e=$('#end');e.innerHTML=`<div><h2>${t[0]}</h2>${t[1].replace(/\n/g,'<br>')}<br><button onclick="location.reload()">처음부터 다시</button></div>`;
 e.classList.add('on');setDark(false)}

/* =====================================================================
   [편집 가능] 몰입 장치
   IDLE_MS : 아무것도 안 했을 때 힌트 아이콘이 깜빡이기 시작하는 시간(밀리초)
   HINT    : icon = 깜빡일 아이콘(gallery / cal),  done = 힌트를 그만두는 조건
   URGE    : 박팀장님 재촉 문자  first=첫 문자까지, every=그 다음부터 간격(밀리초), lines=문구들
   ===================================================================== */
const IDLE_MS=15000;
const HINT={icon:'gallery',done:()=>unkSched};
const URGE={onUnlock:false,first:40000,every:45000,lines:['대답이 없네? 뭐라도 잡았으면 바로 보고해.','야, 김기자. 읽었으면 대답을 해야지.','…나한테 숨기는 거 있는 건 아니지?']};
function buzz(){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}const p=$('#phone');p.classList.remove('buzz');void p.offsetWidth;p.classList.add('buzz')}
let idleT=0;
const hintEl=()=>document.querySelector('#grid .app[data-id="'+HINT.icon+'"]');
function resetIdle(){clearTimeout(idleT);const t=hintEl();if(t)t.classList.remove('blink');
 idleT=setTimeout(()=>{if(!locked&&!HINT.done()){const t=hintEl();if(t)t.classList.add('blink')}},IDLE_MS)}
['pointerdown','keydown','pointermove'].forEach(ev=>addEventListener(ev,resetIdle));resetIdle();
let urgeI=0,urgeOn=false;
function startUrge(){if(urgeOn)return;urgeOn=true;
 const go=()=>{if(urgeI>=URGE.lines.length||ended())return;const x=URGE.lines[urgeI++];
  push('desk',x);heads('박팀장님',x,()=>{open('msgs');chat('desk')});setTimeout(go,URGE.every)};
 setTimeout(go,URGE.first)}
/* 파파라치 컷(골목 사진)의 촬영 시각 = 접속 시각 (1~3분 전) */
let SCANBASE=Date.now();
function setScan(b){SCANBASE=b;PH.filter(p=>p.k).forEach((p,j)=>{const dt=sShift(new Date(b-(3-j)*60000));p.y=dt.getFullYear();p.d=[dt.getMonth()+1,dt.getDate(),dt.getHours(),dt.getMinutes()]})}
setScan(SCANBASE);
const _meta=meta;meta=function(p,i){const r=_meta(p,i);if(p.cam){r.size='0.21MB';r.iso='ISO 3200';r.sh='1/10 s';r.file=p.file}return r};

/* ---------- 상태 저장 / 이어받기 ----------
   모든 핸드폰이 같은 도메인에서 열리면 대화·메모·알람·설정·삭제한 사진 등이 다음 핸드폰으로 이어집니다. */
function saveState(){try{localStorage.setItem('press_state',JSON.stringify({
 threads:Object.fromEntries(Object.entries(threads).map(([k,t])=>[k,{msgs:t.msgs,unread:t.unread,ts:t.ts,time:t.time,hidden:!!t.hidden}])),
 clock,deskIdx,sunIdx,kwN,bossN,scN,unkSched,gone:[...gone],notes:notes.map(n=>n.b),aon:[...aon],SWS,bright,ghist,inst:[...inst],swc,tm,cx,
 narr2:typeof narr2!=='undefined'?narr2:false,scan:PH.some(p=>p.k)?SCANBASE:0,cam:PH.filter(p=>p.cam)}))}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem('press_state')||'null');if(!s)return;
 Object.entries(s.threads).forEach(([k,t])=>Object.assign(threads[k],t));
 clock=s.clock;deskIdx=s.deskIdx;sunIdx=s.sunIdx;Object.assign(kwN,s.kwN);bossN=s.bossN;scN=s.scN;unkSched=s.unkSched;
 s.gone.forEach(i=>gone.add(i));s.notes.forEach((b,i)=>{if(notes[i])notes[i].b=b});s.aon.forEach(i=>aon.add(i));Object.assign(SWS,s.SWS);ghist=s.ghist;s.inst.forEach(i=>inst.add(i));Object.assign(swc,s.swc);Object.assign(tm,s.tm);cx=s.cx||'';
 if(typeof narr2!=='undefined')narr2=!!s.narr2;if(s.scan)setScan(s.scan);(s.cam||[]).forEach(p=>PH.push(p));if(s.bright!==60)setBright(s.bright)}catch(e){}}
loadState();updBadge();setInterval(saveState,1500);addEventListener('pagehide',saveState);
</script>
